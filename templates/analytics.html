<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provenance Guard — Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f8fafc;
    }

    header span {
      font-size: 0.8rem;
      background: #1e293b;
      color: #94a3b8;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #334155;
    }

    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .card .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1;
    }

    .card .sub {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.3rem;
    }

    .section {
      max-width: 900px;
      margin: 0 auto 1.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.5rem;
    }

    .section h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .bar-row .bar-label {
      width: 140px;
      font-size: 0.82rem;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      background: #0f1117;
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .bar-fill.ai     { background: #ef4444; }
    .bar-fill.unsure { background: #f59e0b; }
    .bar-fill.human  { background: #22c55e; }

    .bar-row .bar-pct {
      width: 48px;
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: right;
      flex-shrink: 0;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
    }

    .meta-row:last-child { border-bottom: none; }
    .meta-row .meta-key  { color: #64748b; }

    .refresh {
      max-width: 900px;
      margin: 0 auto;
      font-size: 0.75rem;
      color: #475569;
      text-align: right;
    }

    .error {
      max-width: 900px;
      margin: 2rem auto;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: #fca5a5;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🛡️ Provenance Guard</h1>
  <span>Analytics Dashboard</span>
</header>

<div id="root"><p style="color:#64748b;text-align:center;margin-top:4rem;">Loading...</p></div>

<script>
  async function load() {
    const root = document.getElementById("root");
    try {
      const res = await fetch("/analytics");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();

      const ab = d.attribution_breakdown;
      const ac = d.avg_confidence;

      root.innerHTML = `
        <div class="grid">
          <div class="card">
            <div class="label">Total Submissions</div>
            <div class="value">${d.total_submissions}</div>
            <div class="sub">${d.submissions_last_7_days} in the last 7 days</div>
          </div>
          <div class="card">
            <div class="label">Total Appeals</div>
            <div class="value">${d.total_appeals}</div>
            <div class="sub">${d.appeal_rate_pct}% appeal rate</div>
          </div>
          <div class="card">
            <div class="label">Signal Disagreement</div>
            <div class="value">${d.signal_disagreement_rate_pct}%</div>
            <div class="sub">LLM vs stylo divergence &gt; 0.3</div>
          </div>
        </div>

        <div class="section">
          <h2>Attribution Breakdown</h2>
          <div class="bar-row">
            <div class="bar-label">⚠️ Likely AI</div>
            <div class="bar-track"><div class="bar-fill ai" style="width:${ab.likely_ai.pct}%"></div></div>
            <div class="bar-pct">${ab.likely_ai.pct}%</div>
          </div>
          <div class="bar-row">
            <div class="bar-label">🔍 Uncertain</div>
            <div class="bar-track"><div class="bar-fill unsure" style="width:${ab.uncertain.pct}%"></div></div>
            <div class="bar-pct">${ab.uncertain.pct}%</div>
          </div>
          <div class="bar-row">
            <div class="bar-label">✅ Likely Human</div>
            <div class="bar-track"><div class="bar-fill human" style="width:${ab.likely_human.pct}%"></div></div>
            <div class="bar-pct">${ab.likely_human.pct}%</div>
          </div>
        </div>

        <div class="section">
          <h2>Average Confidence by Attribution</h2>
          <div class="meta-row">
            <span class="meta-key">Likely AI — avg confidence</span>
            <span>${ac.likely_ai !== null ? ac.likely_ai : "—"}</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Uncertain — avg confidence</span>
            <span>${ac.uncertain !== null ? ac.uncertain : "—"}</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Likely Human — avg confidence</span>
            <span>${ac.likely_human !== null ? ac.likely_human : "—"}</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Signal disagreement rate</span>
            <span>${d.signal_disagreement_rate_pct}%</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Appeal rate</span>
            <span>${d.appeal_rate_pct}%</span>
          </div>
        </div>

        <div class="refresh">
          Data from audit log · <a href="#" onclick="load(); return false;" style="color:#3b82f6;">Refresh</a>
        </div>
      `;
    } catch (err) {
      root.innerHTML = `<div class="error">Failed to load analytics: ${err.message}<br>Make sure the Flask server is running and the /analytics endpoint is reachable.</div>`;
    }
  }

  load();
</script>
</body>
</html>
